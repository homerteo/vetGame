<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantallas y overlays — dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1838; }
      #game { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, #e6d2f7 0 35%, #a987d4 75%, #6a4a91 100%); will-change: transform; }
      #game::after { content: ''; position: absolute; left: 26%; right: 26%; top: 26%; bottom: 26%; border-radius: 18px;
        background: radial-gradient(ellipse at 50% 50%, #9e2230 0 16%, #d9707a 30%, #f0b39a 55%, #f4c7ad 80%); box-shadow: 0 0 0 16px #b596dc; }
      #ui-root { position: absolute; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      #devbar { position: fixed; left: 8px; bottom: 6px; z-index: 999; font: 700 11px 'Nunito', sans-serif; color: #fff; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 8px; pointer-events: none; }
      #log { position: fixed; right: 8px; bottom: 6px; z-index: 999; font: 700 11px 'Nunito', sans-serif; color: #fff; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 8px; pointer-events: none; max-width: 420px; white-space: nowrap; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-root"></div>
    <div id="devbar">1 Título · 2 Casos · 3 Briefing · 4 Auditoría · 5 Boutique · 6 Ajustes · 7 Pausa · 8 Intersticial · 9 RCP · 0 Respiración · G Gigi</div>
    <div id="log"></div>
    <script type="module" src="./screens.ts"></script>
  </body>
</html>
