<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev · Pasos B (hueso)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      body { background: #1c0f24; }
      #top { position: fixed; left: 0; top: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
        background: linear-gradient(90deg, #3b2146, #5a2a63); color: #fff6fb; z-index: 5; }
      #top h1 { font: 800 20px 'Baloo 2', Nunito, sans-serif; margin: 0 10px 0 0; color: #ff8fc7; white-space: nowrap; }
      #tabs { display: flex; gap: 6px; flex-wrap: nowrap; }
      #tabs button { font: 800 12px Nunito, sans-serif; border: 2px solid #c8a2e8; background: rgba(255,255,255,.08); color: #fff6fb;
        border-radius: 999px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
      #tabs button.on { background: #ff2e93; border-color: #ff8fc7; }
      #wound { position: fixed; left: 0; top: 56px; width: 960px; height: 600px; cursor: none; touch-action: none; }
      #side { position: fixed; left: 960px; top: 56px; width: 320px; bottom: 0; padding: 10px; overflow: hidden;
        background: linear-gradient(180deg, #2a1533, #1c0f24); color: #fff6fb; font-family: Nunito, sans-serif; }
      .card { background: rgba(255,246,251,.95); color: #3b2146; border-radius: 16px; padding: 8px 10px; margin-bottom: 8px;
        border: 2px solid #c8a2e8; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
      .card h3 { margin: 0 0 4px; font: 800 13px 'Baloo 2', Nunito, sans-serif; color: #ff2e93; letter-spacing: .3px; text-transform: uppercase; }
      #hint { font-weight: 800; font-size: 14px; line-height: 1.25; min-height: 36px; }
      #check div { font-size: 13px; font-weight: 700; margin: 2px 0; }
      #check div.done { color: #23906a; text-decoration: line-through; }
      .gauge { margin: 5px 0 7px; font-size: 12px; font-weight: 800; }
      .gauge .bar { position: relative; height: 12px; border-radius: 999px; background: #eee3f5; overflow: hidden; margin-top: 2px; }
      .gauge .zone { position: absolute; top: 0; bottom: 0; opacity: .55; }
      .gauge .zone.good { background: #3fcf9c; } .gauge .zone.warn { background: #ffb347; } .gauge .zone.bad { background: #ff4d6d; }
      .gauge .mark { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #3b2146; border-radius: 2px; }
      #prog { height: 10px; border-radius: 999px; background: #eee3f5; overflow: hidden; }
      #prog i { display: block; height: 100%; background: linear-gradient(90deg, #9ff0d0, #3fcf9c); width: 0; }
      #log div { font-size: 12px; font-weight: 700; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #log .fault { color: #d6143a; } #log .gesture { color: #23906a; } #log .say { color: #6d4a7a; font-style: italic; }
      #hotbar { position: fixed; left: 0; top: 656px; width: 960px; height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px;
        background: linear-gradient(0deg, #1c0f24, #2a1533); }
      .slot { width: 92px; height: 44px; border-radius: 22px; border: 3px solid #c8a2e8; background: rgba(255,255,255,.08); color: #fff6fb;
        font: 800 12px Nunito, sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .slot.on { background: #ff2e93; border-color: #f5c542; box-shadow: 0 0 12px rgba(245,197,66,.7); }
      #pressure { color: #fff6fb; font: 800 12px Nunito, sans-serif; margin-left: 14px; }
      #pressure b { color: #ff8fc7; }
      #mg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      .pop { position: fixed; z-index: 30; pointer-events: none; font: 800 20px 'Baloo 2', Nunito, sans-serif; transform: translate(-50%, -50%);
        -webkit-text-stroke: 1.2px #3b2146; paint-order: stroke fill; animation: popup 1.1s ease-out forwards; white-space: nowrap; }
      .pop.perfect { color: #f5c542; } .pop.good { color: #9ff0d0; } .pop.miss { color: #ffb347; } .pop.bad { color: #ff4d6d; }
      @keyframes popup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
      #sub { position: fixed; left: 480px; top: 76px; transform: translateX(-50%); z-index: 25; max-width: 700px; padding: 6px 14px; border-radius: 14px;
        background: rgba(59,33,70,.88); color: #fff6fb; font: 700 14px Nunito, sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none; }
      #sub b { color: #ff8fc7; }
      #banner { position: fixed; left: 480px; top: 300px; transform: translate(-50%, -50%); z-index: 26; padding: 12px 26px; border-radius: 22px;
        background: linear-gradient(135deg, #b8ffe6, #3fcf9c); color: #3b2146; font: 800 26px 'Baloo 2', Nunito, sans-serif; display: none;
        box-shadow: 0 8px 30px rgba(0,0,0,.4); pointer-events: none; text-align: center; }
      #banner small { display: block; font: 700 13px Nunito, sans-serif; }
    </style>
  </head>
  <body>
    <div id="top"><h1>Pasos B · hueso</h1><div id="tabs"></div></div>
    <canvas id="wound" width="960" height="600"></canvas>
    <div id="hotbar"></div>
    <div id="side">
      <div class="card"><h3 id="stitle">Paso</h3><div id="hint"></div><div id="prog"><i></i></div></div>
      <div class="card"><h3>Checklist</h3><div id="check"></div></div>
      <div class="card"><h3>Medidores</h3><div id="gauges"></div></div>
      <div class="card"><h3>Registro</h3><div id="log"></div></div>
      <div class="card" style="font-size:11px;font-weight:700;line-height:1.35">1–7 paso · Tab instrumento · rueda presión · Q/E girar · I irrigar ·
        R rayos X · Espacio atrapar · U tornillo del suelo · N reiniciar</div>
    </div>
    <div id="mg-layer"></div>
    <div id="sub"></div>
    <div id="banner"></div>
    <script type="module" src="./stepsB.ts"></script>
  </body>
</html>
