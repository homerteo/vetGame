<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pasos A · banco de pruebas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --lilac: #c8a2e8;
        --lavender: #b79cf2;
        --mint: #9ff0d0;
        --mint-deep: #3fcf9c;
        --bubblegum: #ff8fc7;
        --fuchsia: #ff2e93;
        --cream: #fff6fb;
        --ink: #3b2146;
        --warn: #ffb347;
        --bad: #ff4d6d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1c0f24; color: var(--cream); font-family: 'Nunito', system-ui, sans-serif; }
      #top { position: absolute; left: 16px; right: 16px; top: 8px; height: 44px; display: flex; align-items: center; gap: 8px; }
      #top h1 { font-size: 20px; margin: 0 10px 0 0; color: var(--bubblegum); font-weight: 900; letter-spacing: 0.3px; white-space: nowrap; }
      .tab { border: 2px solid rgba(200, 162, 232, 0.5); background: rgba(59, 33, 70, 0.8); color: var(--cream); border-radius: 999px; padding: 5px 11px; font: 800 13px Nunito, system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
      .tab b { color: var(--mint); margin-right: 4px; }
      .tab.on { background: linear-gradient(135deg, #ff4fa8, #ff2e93 45%, #c4136c); border-color: #ffd0e8; box-shadow: 0 3px 0 #9c0f55; }
      #stage { position: absolute; left: 16px; top: 60px; width: 896px; height: 560px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45); cursor: none; }
      #wound { width: 896px; height: 560px; display: block; }
      #pops { position: absolute; inset: 0; pointer-events: none; }
      .pop { position: absolute; transform: translate(-50%, -100%); font: 900 16px Nunito, system-ui, sans-serif; padding: 3px 10px; border-radius: 999px; white-space: nowrap; animation: rise 1.1s ease-out forwards; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
      .pop.perfect { background: linear-gradient(135deg, #fff1a8, #ffd24a); color: #6b3b00; box-shadow: 0 0 14px rgba(255, 210, 74, 0.8); font-size: 19px; }
      .pop.good { background: var(--mint); color: #134d38; }
      .pop.miss { background: rgba(255, 246, 251, 0.92); color: var(--ink); }
      .pop.bad { background: var(--bad); color: #fff; }
      @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -60%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -100%) scale(1.08); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -230%) scale(1); } }
      #say { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(59, 33, 70, 0.9); border: 2px solid var(--bubblegum); border-radius: 16px; padding: 6px 14px; font: 700 15px Nunito, system-ui, sans-serif; opacity: 0; transition: opacity 0.25s; max-width: 80%; text-align: center; }
      #say b { color: var(--bubblegum); }
      #banner { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: linear-gradient(135deg, #9ff0d0, #3fcf9c); color: #0f3d2c; font: 900 20px Nunito, system-ui, sans-serif; padding: 6px 18px; border-radius: 999px; box-shadow: 0 4px 0 #1f8f68; display: none; }
      #panel { position: absolute; left: 928px; top: 60px; width: 336px; height: 560px; display: flex; flex-direction: column; gap: 8px; }
      .card { background: rgba(59, 33, 70, 0.88); border: 2px solid rgba(255, 143, 199, 0.45); border-radius: 16px; padding: 9px 12px; }
      .card h2 { margin: 0 0 4px; font: 900 13px Nunito, system-ui, sans-serif; color: var(--bubblegum); text-transform: uppercase; letter-spacing: 0.8px; }
      #stepname { font: 900 19px Nunito, system-ui, sans-serif; color: var(--cream); }
      #meta { font-size: 12px; opacity: 0.8; margin-top: 2px; }
      #hint { font: 700 14px Nunito, system-ui, sans-serif; line-height: 1.3; color: #fff; }
      ul#check { list-style: none; margin: 0; padding: 0; font-size: 14px; }
      ul#check li { padding: 2px 0; }
      ul#check li::before { content: '♡ '; color: var(--lavender); }
      ul#check li.done { color: var(--mint); }
      ul#check li.done::before { content: '♥ '; color: var(--mint-deep); }
      .gauge { margin: 4px 0 6px; }
      .gauge .lbl { display: flex; justify-content: space-between; font: 800 12px Nunito, system-ui, sans-serif; }
      .gauge .bar { position: relative; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 3px; }
      .gauge .zone { position: absolute; top: 0; bottom: 0; opacity: 0.45; }
      .gauge .zone.good { background: var(--mint-deep); }
      .gauge .zone.warn { background: var(--warn); }
      .gauge .zone.bad { background: var(--bad); }
      .gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px #fff; }
      #log { font-size: 12px; line-height: 1.35; flex: 1; overflow: hidden; }
      #log div.g { color: var(--mint); }
      #log div.f { color: #ff8fa3; }
      #log div.b { color: #ffd24a; }
      #bottom { position: absolute; left: 16px; top: 628px; width: 896px; font: 700 13px Nunito, system-ui, sans-serif; color: rgba(255, 246, 251, 0.85); display: flex; flex-wrap: wrap; gap: 6px 14px; }
      kbd { background: rgba(255, 255, 255, 0.14); border-radius: 5px; padding: 0 5px; font: 800 12px ui-monospace, monospace; color: var(--mint); }
      #status { position: absolute; left: 16px; top: 676px; width: 1248px; font: 700 13px Nunito, system-ui, sans-serif; display: flex; gap: 18px; color: rgba(255, 246, 251, 0.9); }
      #status span b { color: var(--bubblegum); }
    </style>
  </head>
  <body>
    <div id="top"><h1>Pasos A · quirófano de juguete</h1></div>
    <div id="stage">
      <canvas id="wound" width="896" height="560"></canvas>
      <div id="pops"></div>
      <div id="banner">¡Paso completado! ♥</div>
      <div id="say"></div>
    </div>
    <div id="panel">
      <div class="card"><div id="stepname"></div><div id="meta"></div></div>
      <div class="card"><h2>Pista</h2><div id="hint"></div></div>
      <div class="card"><h2>Checklist</h2><ul id="check"></ul></div>
      <div class="card"><h2>Medidores</h2><div id="gauges"></div></div>
      <div class="card" id="logcard" style="flex: 1; display: flex; flex-direction: column"><h2>Registro</h2><div id="log"></div></div>
    </div>
    <div id="bottom">
      <span><kbd>1</kbd>–<kbd>7</kbd> paso</span>
      <span><kbd>Rueda</kbd> presión</span>
      <span><kbd>C</kbd> cauterio universal</span>
      <span><kbd>Z</kbd> Rodrigo aspira</span>
      <span><kbd>G</kbd> nivel de guía</span>
      <span><kbd>T</kbd> tutorial</span>
      <span><kbd>R</kbd> reiniciar</span>
      <span><kbd>Clic rueda</kbd> trinquete</span>
    </div>
    <div id="status"></div>
    <script type="module" src="./stepsA.ts"></script>
  </body>
</html>
